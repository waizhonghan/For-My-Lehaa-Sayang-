<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Memories 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts-bg"></div>

  <nav class="music-player">
    <span>🎵 Our Little Playlist</span>
    <select id="songSelect" aria-label="Choose a song">
      <option value="0">Song 1 💗</option>
      <option value="1">Song 2 💜</option>
      <option value="2">Song 3 ❤️</option>
    </select>
    <button id="playBtn">▶ Play</button>
    <button id="nextBtn">Next ⏭</button>
    <audio id="bgMusic" loop></audio>
  </nav>

  <main class="page-container">
    <section class="memory-section">
      <p class="eyebrow">Little moments, precious memories</p>
      <h1>Our Memory Zone 💞</h1>
      <p class="welcome-text">
        Every picture has a story. Every moment is special. ♡
      </p>

      <div class="memory-grid">
        <figure class="memory-card">
          <span class="photo-heart">💗</span>
          <img src="assets/memory-1.jpg" alt="Our memory 1">
          <figcaption>One of my favourite moments ♡</figcaption>
        </figure>

        <figure class="memory-card">
          <span class="photo-heart">💕</span>
          <img src="assets/memory-2.jpg" alt="Our memory 2">
          <figcaption>A little moment to remember</figcaption>
        </figure>

        <figure class="memory-card">
          <span class="photo-heart">💜</span>
          <img src="assets/memory-3.jpg" alt="Our memory 3">
          <figcaption>Something special to us</figcaption>
        </figure>

        <figure class="memory-card">
          <span class="photo-heart">💖</span>
          <img src="assets/memory-4.jpg" alt="Our memory 4">
          <figcaption>Another lovely memory</figcaption>
        </figure>

        <figure class="memory-card">
          <span class="photo-heart">💗</span>
          <img src="assets/memory-5.jpg" alt="Our memory 5">
          <figcaption>Always worth remembering</figcaption>
        </figure>

        <figure class="memory-card">
          <span class="photo-heart">💞</span>
          <img src="assets/memory-6.jpg" alt="Our memory 6">
          <figcaption>More memories to come ♡</figcaption>
        </figure>
      </div>

      <a class="main-button" href="declaration.html">
        One Last Little Surprise 💌
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
